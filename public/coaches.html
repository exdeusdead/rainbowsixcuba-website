<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="./assets/logo/r6cuba-shield.webp" />
    <title>Rainbow Six CUBA</title>
  </head>
  <body>
    <main><p><a id="continue" href="./?section=coaches">Continuar / Continue</a></p></main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        params.set("section", "coaches");
        params.delete("aux");
        const target = new URL("./", location.href);
        target.search = params.toString();
        document.querySelector("#continue").href = target.href;
        location.replace(target.href);
      })();
    </script>
  </body>
</html>
